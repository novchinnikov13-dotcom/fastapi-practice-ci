name: CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format code (Black + Isort)
        run: |
          black .
          isort .

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "fix: auto-format code with black & isort"
          file_pattern: "*.py"
         
      - name: Run mypy
        run: mypy .

      - name: Run black (verification)
        run: black --diff --check .

      - name: Run isort (verification)
        run: isort --check-only .

      - name: Run flake8
        run: flake8 .

      - name: Run pytest
        run: pytest -v
